<script>
  const state = {
    cases: [],
    reportCases: [],
    registrations: [],
    lineUserId: '',
    liffProfileName: '',
    currentView: 'registration',
    adminCaseId: '',
    adminMode: '',
    adminFilter: 'needsAction',
    adminSearch: '',
    adminCaseScope: 'current',
    adminCaseSearch: '',
    adminSelectedRecords: new Set(),
    adminToken: '',
    paymentReportMode: 'idle',
    reportSelectedRecords: new Set(),
    reportEditingHostId: '',
    reportEditingRecordIds: [],
    reportSelectionTouched: false,
    quickReportRecords: [],
    registrationNoticePending: false
  };

  const ADMIN_SESSION_KEY = 'donationAdminAuthed';
  const ADMIN_TOKEN_KEY = 'donationAdminToken';
  const els = {};

  document.addEventListener('DOMContentLoaded', () => {
    setupRegistrationUiDraft();
    cacheElements();
    bindEvents();
    updateReceiptModeVisibility();
    hydrateInitialLineProfile();
    renderLoadingCases();
    initializeApp();
  });

  async function initializeApp() {
    state.suppressLiffLoadData = true;
    const shouldContinue = await initLiff();
    state.suppressLiffLoadData = false;
    if (shouldContinue === false || state.liffRedirecting) return;

    if (document.body.dataset.mode === 'admin') {
      openAdminWithPassword();
    } else {
      switchView('registration');
      if (!state.dataLoadStarted) loadData();
    }
  }

  function setupRegistrationUiDraft() {
    const intro = document.querySelector('#registrationView .screenIntro');
    if (intro) {
      const heading = intro.querySelector('h1');
      const note = intro.querySelector('p');
      if (heading) heading.textContent = '捐款登記';
      if (note) note.textContent = '選擇開放個案，填寫代表人與芳名資料。';
    }

    const projectTitle = document.querySelector('.projectPanel .sectionTitle');
    if (projectTitle) projectTitle.textContent = '開放個案';

    const repPanel = document.getElementById('representativeName')?.closest('.panel');
    if (repPanel) {
      repPanel.classList.add('representativePanel');
      const title = repPanel.querySelector('.sectionTitle');
      if (title) title.remove();
      repPanel.querySelectorAll('.field').forEach((field) => field.classList.add('inlineField'));
      const nameLabel = repPanel.querySelector('label:nth-of-type(1) span');
      const phoneLabel = repPanel.querySelector('label:nth-of-type(2) span');
      if (nameLabel) nameLabel.textContent = '代表人姓名';
      if (phoneLabel) phoneLabel.textContent = '代表人手機';
      const nameInput = document.getElementById('representativeName');
      const phoneInput = document.getElementById('representativePhone');
      if (nameInput) nameInput.placeholder = '例如：張大同';
      if (phoneInput) phoneInput.placeholder = '例如：0912-345-678';
      phoneInput?.closest('.field')?.remove();
    }

    const paymentPanel = document.getElementById('paymentMethod')?.closest('.panel');
    if (paymentPanel) {
      const title = paymentPanel.querySelector('.sectionTitle');
      if (title) title.textContent = '付款方式';
      const labels = {
        bankTransfer: '轉帳',
        atm: '轉帳',
        cash: '現金'
      };
      paymentPanel.querySelector('[data-value="atm"]')?.remove();
      paymentPanel.querySelector('[data-value="other"]')?.remove();
      paymentPanel.querySelectorAll('.optionButton').forEach((button) => {
        button.textContent = labels[button.dataset.value] || button.textContent.trim();
      });
    }

    const donorPanel = document.getElementById('bulkDonors')?.closest('.panel');
    if (donorPanel) {
      donorPanel.classList.add('donorEntryPanel');
      donorPanel.innerHTML = `
        <div class="donorHeader">
          <div class="sectionTitle">捐款芳名清單</div>
        </div>
        <div id="bulkDonorPanel" class="donorModePanel">
          <textarea id="bulkDonors" rows="6" placeholder="可填方式：
王小明100
王小明 100
王小明：100
王小明100、李小華200
Christian GRADERT100"></textarea>
          <button id="parseDonorsButton" class="secondaryAction" type="button">名單確認</button>
          <div id="bulkDonorResult" class="bulkDonorResult"></div>
        </div>
        <div id="donorList" class="donorList"></div>
        <div class="summary">
          <span>總金額</span>
          <strong id="totalAmount">0 元</strong>
        </div>
      `;
    }

    const receiptPanel = document.getElementById('receiptRequired')?.closest('.panel');
    if (receiptPanel) {
      receiptPanel.classList.add('submitPanel');
      receiptPanel.innerHTML = `
        <button id="submitButton" class="primary" type="button">送出登記</button>
        <div id="frontResult" class="result"></div>
      `;
    }
  }

  function cacheElements() {
    [
      'caseSelect',
      'caseCards',
      'representativeName',
      'representativePhone',
      'paymentMethod',
      'donorList',
      'donorTemplate',
      'bulkDonors',
      'bulkDonorResult',
      'totalAmount',
      'receiptRequired',
      'receiptMode',
      'receiptModePanel',
      'bulkDonorPanel',
      'memo',
      'submitButton',
      'frontResult',
      'myRecords',
      'adminRows',
      'adminCaseSummary',
      'adminCaseSearch',
      'adminWorkArea',
      'adminBackButton',
      'adminCaseTitle',
      'adminCaseMeta',
      'adminSearch',
      'adminSelectAllButton',
      'adminClearSelectionButton',
      'adminBulkBar',
      'adminBulkCount',
      'refreshButton',
      'profileName',
      'adminButton',
      'bottomNav'
    ].forEach((id) => {
      els[id] = document.getElementById(id);
    });
  }

  function bindEvents() {
    document.querySelectorAll('.tabButton').forEach((button) => {
      button.addEventListener('click', () => switchView(button.dataset.view));
    });

    els.adminButton.addEventListener('click', openAdminWithPassword);

    document.querySelectorAll('.optionButtons').forEach((group) => {
      group.addEventListener('click', (event) => {
        const button = event.target.closest('.optionButton');
        if (!button) return;
        const target = document.getElementById(group.dataset.target);
        target.value = button.dataset.value;
        group.querySelectorAll('.optionButton').forEach((item) => {
          item.classList.toggle('selected', item === button);
        });
        if (group.dataset.target === 'receiptRequired') {
          updateReceiptModeVisibility();
        }
      });
    });

    document.getElementById('parseDonorsButton')?.addEventListener('click', parseBulkDonors);
    els.submitButton.addEventListener('click', submitRegistration);
    els.refreshButton.addEventListener('click', loadData);
    document.querySelectorAll('[data-case-scope]').forEach((button) => {
      button.addEventListener('click', () => {
        state.adminCaseScope = button.dataset.caseScope;
        state.adminCaseId = '';
        state.adminMode = '';
        state.adminSelectedRecords.clear();
        renderAdminRows();
      });
    });
    els.adminCaseSearch.addEventListener('input', () => {
      state.adminCaseSearch = els.adminCaseSearch.value.trim();
      state.adminCaseId = '';
      state.adminMode = '';
      state.adminSelectedRecords.clear();
      renderAdminRows();
    });
    els.adminBackButton.addEventListener('click', () => {
      state.adminCaseId = '';
      state.adminMode = '';
      state.adminSelectedRecords.clear();
      renderAdminRows();
    });
    els.adminSearch.addEventListener('input', () => {
      state.adminSearch = els.adminSearch.value.trim();
      state.adminSelectedRecords.clear();
      renderAdminRows();
    });
    els.adminSelectAllButton.addEventListener('click', selectVisibleAdminRecords);
    els.adminClearSelectionButton.addEventListener('click', () => {
      state.adminSelectedRecords.clear();
      renderAdminRows();
    });
    document.querySelectorAll('.adminFilterButton').forEach((button) => {
      button.addEventListener('click', () => {
        state.adminFilter = button.dataset.filter;
        state.adminSelectedRecords.clear();
        renderAdminRows();
      });
    });
    els.adminCaseSummary.addEventListener('click', (event) => {
      const card = event.target.closest('[data-admin-case-id]');
      if (!card) return;
      state.adminCaseId = card.dataset.adminCaseId;
      state.adminMode = '';
      state.adminSelectedRecords.clear();
      renderAdminRows();
    });
    els.adminRows.addEventListener('click', (event) => {
      const modeButton = event.target.closest('[data-admin-mode]');
      if (modeButton) {
        state.adminMode = modeButton.dataset.adminMode;
        state.adminSelectedRecords.clear();
        renderAdminRows();
        return;
      }
      if (event.target.closest('#adminHelperCreateButton')) {
        createHelperBatchFromAdmin();
        return;
      }
      const archiveButton = event.target.closest('[data-case-archive-action]');
      if (archiveButton) {
        setCurrentCaseArchiveState(archiveButton.dataset.caseArchiveAction === 'archive');
        return;
      }
      const card = event.target.closest('[data-record-id]');
      if (!card) return;
      const recordId = card.dataset.recordId;
      if (state.adminSelectedRecords.has(recordId)) {
        state.adminSelectedRecords.delete(recordId);
      } else {
        state.adminSelectedRecords.add(recordId);
      }
      renderAdminRows();
    });
    els.adminBulkBar.addEventListener('click', (event) => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      runBulkAdminAction(button.dataset.action);
    });
    els.myRecords.addEventListener('click', (event) => {
      if (event.target.closest('#quickReportToggle')) {
        toggleQuickReport();
      }
      if (event.target.closest('#quickReportSearchButton')) {
        searchQuickReportRecords();
      }
      if (event.target.closest('#batchReportButton')) {
        openSelectedReportForm();
      }
    });
    els.myRecords.addEventListener('change', (event) => {
      if (!event.target.classList.contains('reportRecordCheckbox')) return;
      if (state.paymentReportMode === 'editingBatchReport') return;
      state.paymentReportMode = 'selecting';
      state.reportSelectionTouched = true;
      if (event.target.checked) {
        state.reportSelectedRecords.add(event.target.value);
      } else {
        state.reportSelectedRecords.delete(event.target.value);
      }
      renderMyRecords();
    });
    els.donorList.addEventListener('input', updateTotal);
    els.donorList.addEventListener('click', (event) => {
      if (event.target.classList.contains('removeDonor')) {
        event.target.closest('.donorRow').remove();
        updateTotal();
      }
    });
  }

  function hydrateInitialLineProfile() {
    state.lineUserId = document.body.dataset.lineUserId || '';
    state.liffProfileName = document.body.dataset.liffProfileName || '';
    if (state.liffProfileName) {
      els.profileName.textContent = `LINE：${state.liffProfileName}`;
    }
  }

  async function initLiff() {
    if (state.lineUserId) {
      showLineIdentityMessage('LINE 身分已完成，正在讀取你的回報紀錄。');
      return;
    }

    const liffId = document.body.dataset.liffId;
    showLineIdentityMessage(`LIFF 偵錯：準備初始化，LIFF ID=${liffId || '未設定'}`);
    if (!liffId) {
      showLineIdentityMessage('尚未設定 LIFF ID，請通知管理者。');
      return;
    }
    if (!window.liff) {
      showLineIdentityMessage('LINE 元件尚未載入，請關閉後從 LINE 重新開啟。');
      return;
    }

    try {
      showLineIdentityMessage('LIFF 偵錯：SDK 已載入，開始 liff.init()...');
      await withTimeout(liff.init({ liffId }), 15000, 'liff.init() 逾時');
      const inClient = liff.isInClient ? liff.isInClient() : '未知';
      const loggedIn = liff.isLoggedIn ? liff.isLoggedIn() : '未知';
      showLineIdentityMessage(`LIFF 偵錯：init 完成，inClient=${inClient}，loggedIn=${loggedIn}`);
      if (liff.isLoggedIn && !liff.isLoggedIn()) {
        if (liff.login && inClient === true) {
          showLineIdentityMessage('尚未取得 LINE 身分，正在嘗試 LINE 登入...');
          state.liffRedirecting = true;
          liff.login({ redirectUri: window.location.href });
          return;
        }
        showLineIdentityMessage('尚未取得 LINE 身分。請從正式 LIFF 連結開啟，或測試時在網址加上 lineUserId。');
        return;
      }
      if (!liff.getProfile) {
        showLineIdentityMessage('無法取得 LINE 個人資料，請從 LIFF 連結重新開啟。');
        return;
      }

      showLineIdentityMessage('LIFF 偵錯：開始讀取 LINE 個人資料...');
      const profile = await withTimeout(liff.getProfile(), 15000, 'liff.getProfile() 逾時');
      state.lineUserId = profile.userId;
      state.liffProfileName = profile.displayName;
      els.profileName.textContent = profile.displayName ? `LINE：${profile.displayName}` : '';
      showLineIdentityMessage(`LIFF 偵錯：取得成功，userId=${profile.userId ? profile.userId.slice(0, 8) + '...' : '空白'}`);
      loadData();
    } catch (error) {
      console.warn(error);
      showLineIdentityMessage(`LINE 身分讀取失敗：${lineErrorMessage(error)}`);
    }
  }

  function withTimeout(promise, ms, message) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))
    ]);
  }

  function showLineIdentityMessage(message) {
    if (els.myRecords) {
      els.myRecords.innerHTML = `<div class="notice">${escapeHtml(message)}</div>`;
    }
  }

  function lineErrorMessage(error) {
    if (!error) return '請關閉後從 LINE 重新開啟。';
    const code = error.code ? `${error.code} ` : '';
    const message = error.message || String(error);
    return `${code}${message}`;
  }

  function loadData() {
    if (state.suppressLiffLoadData) return;
    state.dataLoadStarted = true;
    const shouldLoadAdminData = state.currentView === 'admin' && Boolean(getAdminToken());
    if (!shouldLoadAdminData) {
      loadFrontCases();
      loadMyRecordsData();
      return;
    }

    setBusy(true);
    renderLoadingCases();
    renderLoadingAdminCases();
    google.script.run
      .withSuccessHandler((data) => {
        state.cases = data.cases || [];
        state.reportCases = data.reportCases || data.cases || [];
        state.registrations = [];
        renderCases();
        renderMyRecords();
        renderAdminRows();
        setBusy(false);
        loadAdminRegistrationsData();
      })
      .withFailureHandler(showError)
      .getAdminCasesData({
        adminToken: getAdminToken()
      });
  }

  function loadAdminRegistrationsData() {
    google.script.run
      .withSuccessHandler((data) => {
        state.registrations = data.registrations || [];
        renderAdminRows();
      })
      .withFailureHandler((error) => {
        const rawMessage = error.message || error;
        const message = escapeHtml(rawMessage);
        renderAdminRows();
        if (els.adminCaseSummary) {
          els.adminCaseSummary.insertAdjacentHTML('afterbegin', `<div class="notice">登記資料讀取失敗：${message}</div>`);
        }
      })
      .getAdminRegistrationsData({
        adminToken: getAdminToken()
      });
  }

  function loadFrontCases() {
    setBusy(true);
    renderLoadingCases();
    google.script.run
      .withSuccessHandler((data) => {
        state.cases = data.cases || [];
        state.reportCases = data.reportCases || data.cases || [];
        renderCases();
        renderMyRecords();
        setBusy(false);
      })
      .withFailureHandler(showError)
      .getFrontCases();
  }

  function loadMyRecordsData() {
    if (!state.lineUserId) {
      renderMyRecords();
      return;
    }
    state.myRecordsLoading = true;
    renderMyRecords();
    google.script.run
      .withSuccessHandler((data) => {
        state.registrations = data.registrations || [];
        if (state.paymentReportMode !== 'editingBatchReport') {
          state.reportSelectedRecords.clear();
          state.reportSelectionTouched = false;
          state.paymentReportMode = 'idle';
        }
        state.myRecordsLoading = false;
        renderMyRecords();
      })
      .withFailureHandler((error) => {
        state.myRecordsLoading = false;
        renderMyRecords();
        console.warn(error);
      })
      .getMyRegistrationData({
        lineUserId: state.lineUserId
      });
  }

  function renderLoadingCases() {
    if (els.caseCards) {
      els.caseCards.innerHTML = '<div class="notice">正在讀取開放個案...</div>';
    }
  }

  function renderLoadingAdminCases() {
    if (els.adminCaseSummary && state.currentView === 'admin') {
      els.adminCaseSummary.innerHTML = '<div class="notice">正在讀取後台專案...</div>';
    }
  }

  function renderCases() {
    if (!state.cases.length) {
      els.caseSelect.value = '';
      els.caseCards.innerHTML = '<div class="notice">目前沒有可登記的開放個案。</div>';
      els.submitButton.disabled = true;
      return;
    }

    const selectableCases = state.cases.filter(isCaseSelectable);
    if (!selectableCases.some((item) => item.caseId === els.caseSelect.value)) {
      els.caseSelect.value = selectableCases[0]?.caseId || '';
    }
    els.submitButton.disabled = !els.caseSelect.value;

    els.caseCards.innerHTML = state.cases.map((item, index) => {
      const remaining = Number(item.remainingAmount ?? Math.max(Number(item.targetAmount || 0) - Number(item.currentAmount || 0), 0));
      const full = isCaseFullForUi(item);
      const selectable = isCaseSelectable(item);
      const selected = item.caseId === els.caseSelect.value;
      return `
        <button class="caseCard theme${index % 5} ${selected ? 'selected' : ''} ${full ? 'full' : ''}" type="button" data-case-id="${escapeAttr(item.caseId)}" ${selectable ? '' : 'disabled aria-disabled="true"'}>
          <span class="caseMain">
            <span class="caseTitle">
              <span>${escapeHtml(item.caseId)}</span>
              <strong>${escapeHtml(item.title)}</strong>
            </span>
          </span>
          <span class="caseAmount ${full ? 'fullAmount' : ''}">
            ${full ? `
              <strong>已額滿</strong>
            ` : `
              <span>目標金額 ${money(item.targetAmount)}</span>
              <strong>目標餘額 ${money(remaining)}</strong>
            `}
          </span>
          <span class="caseBar"><span style="width:${caseProgress(item)}%"></span></span>
        </button>
      `;
    }).join('');

    els.caseCards.querySelectorAll('.caseCard').forEach((button) => {
      button.addEventListener('click', () => {
        const caseInfo = state.cases.find((item) => item.caseId === button.dataset.caseId);
        if (!isCaseSelectable(caseInfo)) return;
        els.caseSelect.value = button.dataset.caseId;
        renderCases();
      });
    });
  }

  function caseProgress(item) {
    const target = Number(item.targetAmount || 0);
    if (!target) return 0;
    return Math.min(Math.round((Number(item.currentAmount || 0) / target) * 100), 100);
  }

  function isCaseFullForUi(item) {
    if (!item) return false;
    const status = String(item.status || '').trim();
    const target = Number(item.targetAmount || 0);
    const current = Number(item.currentAmount || 0);
    const remaining = Number(item.remainingAmount ?? Math.max(target - current, 0));
    return status === '已額滿' || (target > 0 && (current >= target || remaining <= 0));
  }

  function isCaseSelectable(item) {
    return Boolean(item) && isCaseOpen(item) && !isCaseFullForUi(item);
  }

  function updateReceiptModeVisibility() {
    const needsReceipt = els.receiptRequired?.value === 'true';
    els.receiptModePanel?.classList.toggle('hidden', !needsReceipt);
  }

  function receiptModeLabel(value) {
    return {
      representativeTotal: '代表人+總金額',
      eachDonor: '每位捐款人單獨開立',
      annualRepresentativeTotal: '年度開立｜代表人總額',
      perPaymentRepresentativeTotal: '每次開立｜代表人總額',
      annualEachDonor: '年度開立｜每位捐款人單獨開立',
      perPaymentEachDonor: '每次開立｜每位捐款人單獨開立',
      other: '其他開立方式'
    }[value] || '代表人+總金額';
  }

  function buildReceiptModeValue(frequency, target) {
    if (frequency === 'other') return 'other';
    if (frequency === 'annual' && target === 'representativeTotal') return 'annualRepresentativeTotal';
    if (frequency === 'perPayment' && target === 'representativeTotal') return 'perPaymentRepresentativeTotal';
    if (frequency === 'annual' && target === 'eachDonor') return 'annualEachDonor';
    if (frequency === 'perPayment' && target === 'eachDonor') return 'perPaymentEachDonor';
    return '';
  }

  function setOptionValue(targetId, value) {
    const input = document.getElementById(targetId);
    if (!input) return;
    input.value = value;
    document.querySelectorAll(`.optionButtons[data-target="${targetId}"] .optionButton`).forEach((button) => {
      button.classList.toggle('selected', button.dataset.value === value);
    });
    if (targetId === 'receiptRequired') updateReceiptModeVisibility();
  }

  function addDonorRow(name = '', amount = '') {
    const fragment = els.donorTemplate.content.cloneNode(true);
    const nameInput = fragment.querySelector('.donorName');
    const amountInput = fragment.querySelector('.donorAmount');
    const removeButton = fragment.querySelector('.removeDonor');
    nameInput.placeholder = '芳名';
    amountInput.placeholder = '金額';
    nameInput.value = name;
    amountInput.value = amount;
    removeButton.textContent = '刪除';
    removeButton.title = '刪除這一位';
    els.donorList.appendChild(fragment);
  }

  function parseBulkDonors() {
    const button = document.getElementById('parseDonorsButton');
    if (button?.disabled) return;
    if (button) {
      button.disabled = true;
      button.textContent = '加入中';
    }
    els.bulkDonorResult.innerHTML = '<div class="notice">正在加入名單，請稍候...</div>';

    const text = els.bulkDonors.value.trim();
    if (!text) {
      els.bulkDonorResult.innerHTML = '<div class="notice">請先貼上芳名與金額。</div>';
      restoreParseDonorsButton(button);
      return;
    }

    const parsed = text
      .split(/[、，,；;\n\r]+/)
      .map((item) => item.trim())
      .filter(Boolean)
      .map(parseDonorToken)
      .filter(Boolean);

    if (!parsed.length) {
      els.bulkDonorResult.innerHTML = '<div class="notice">格式看不出來，請用「姓名100、姓名200」這種格式。</div>';
      restoreParseDonorsButton(button);
      return;
    }

    const current = readDonors();
    if (!current.length) {
      els.donorList.innerHTML = '';
    }

    parsed.forEach((donor) => addDonorRow(donor.name, donor.amount));
    updateTotal();
    els.bulkDonors.value = '';
    els.bulkDonorResult.innerHTML = `
      <div class="success">
        已加入 ${parsed.length} 位，合計 ${money(parsed.reduce((sum, donor) => sum + donor.amount, 0))} 元。<br>
        輸入框已清空，可繼續貼下一批名單。
      </div>
    `;
    restoreParseDonorsButton(button);
  }

  function restoreParseDonorsButton(button) {
    if (!button) return;
    button.disabled = false;
    button.textContent = '名單確認';
  }

  function parseDonorToken(token) {
    const match = token.match(/^(.+?)[\s:：]*([0-9][0-9,]*)$/);
    if (!match) return null;

    const name = match[1].trim();
    const amount = Number(match[2].replace(/,/g, ''));
    if (!name || !amount || amount <= 0) return null;
    return { name, amount };
  }

  function readDonors() {
    return Array.from(document.querySelectorAll('.donorRow'))
      .map((row) => ({
        name: row.querySelector('.donorName').value.trim(),
        amount: Number(row.querySelector('.donorAmount').value || 0)
      }))
      .filter((donor) => donor.name && donor.amount > 0);
  }

  function updateTotal() {
    const total = readDonors().reduce((sum, donor) => sum + donor.amount, 0);
    els.totalAmount.textContent = `${money(total)} 元`;
  }

  async function submitRegistration() {
    if (!state.lineUserId) {
      els.frontResult.innerHTML = '<div class="notice">尚未取得 LINE 身分，請從 LINE 重新開啟後再送出。</div>';
      return;
    }
    const donors = readDonors();
    const totalAmount = donors.reduce((sum, donor) => sum + donor.amount, 0);
    const selectedCase = state.cases.find((item) => item.caseId === els.caseSelect.value);
    if (!isCaseSelectable(selectedCase)) {
      els.frontResult.innerHTML = `<div class="notice">專案 ${escapeHtml(els.caseSelect.value || '')} 已額滿或未開放，無法登記。</div>`;
      renderCases();
      return;
    }
    const payload = {
      caseId: els.caseSelect.value,
      representativeName: els.representativeName.value.trim(),
      representativePhone: '',
      paymentMethod: els.paymentMethod.value,
      donors,
      totalAmount,
      receiptRequired: false,
      sourceType: 'self_created',
      memo: '',
      lineUserId: state.lineUserId,
      liffProfileName: state.liffProfileName
    };

    const localDuplicates = findLocalDuplicateDonors(donors);
    if (localDuplicates.length) {
      const confirmed = await showDuplicateConfirmDialog({
        title: '發現重複芳名',
        message: '這次填寫內已有重複芳名，請確認是否仍要送出。',
        duplicates: localDuplicates,
        confirmText: '仍要送出'
      });
      if (!confirmed) return;
    }

    setBusy(true);
    els.frontResult.innerHTML = '<div class="notice">正在檢查是否重複登記，請稍候。</div>';
    google.script.run
      .withSuccessHandler(async (result) => {
        const duplicates = result?.duplicates || [];
        if (duplicates.length) {
          setBusy(false);
          const confirmed = await showDuplicateConfirmDialog({
            title: '發現重複芳名',
            message: '系統已有相同芳名的登記紀錄，請確認是否仍要送出。',
            duplicates,
            confirmText: '仍要送出'
          });
          if (!confirmed) {
            els.frontResult.innerHTML = '<div class="notice">已取消送出，請確認名單。</div>';
            return;
          }
          setBusy(true);
        }
        createRegistrationAfterDuplicateCheck(payload);
      })
      .withFailureHandler(showError)
      .checkDuplicateRegistration(payload);
  }

  function createRegistrationAfterDuplicateCheck(payload) {
    els.frontResult.innerHTML = '<div class="notice">正在排隊送出登記，請不要關閉或重複按送出。</div>';
    google.script.run
      .withSuccessHandler((result) => {
        resetForm();
        state.registrationNoticePending = true;
        switchView('report');
        showRegistrationSuccessDialog(result.record);
        loadFrontCases();
        loadMyRecordsData();
      })
      .withFailureHandler(showError)
      .createRegistration(payload);
  }

  function findLocalDuplicateDonors(donors) {
    const seen = {};
    const duplicates = [];
    donors.forEach((donor) => {
      const key = normalizeDuplicateName(donor.name);
      if (seen[key]) {
        duplicates.push(donor);
      } else {
        seen[key] = true;
      }
    });
    return duplicates;
  }

  function formatDuplicateLines(duplicates) {
    return duplicates
      .slice(0, 5)
      .map((item) => `${item.name} ${money(item.amount)} 元${item.recordId ? `（${item.recordId}）` : ''}`)
      .join('\n');
  }

  function showDuplicateConfirmDialog(options) {
    return new Promise((resolve) => {
      document.querySelectorAll('.duplicateConfirmOverlay').forEach((item) => item.remove());
      const overlay = document.createElement('div');
      overlay.className = 'reportSuccessOverlay duplicateConfirmOverlay';
      const duplicateHtml = (options.duplicates || [])
        .slice(0, 8)
        .map((item) => `
          <li>
            <strong>${escapeHtml(item.name || '')}</strong>
            <span>${money(item.amount)} 元${item.recordId ? `｜既有編號 ${escapeHtml(item.recordId)}` : ''}</span>
          </li>
        `)
        .join('');
      overlay.innerHTML = `
        <div class="reportSuccessDialog duplicateConfirmDialog" role="dialog" aria-modal="true" aria-labelledby="duplicateConfirmTitle">
          <h2 id="duplicateConfirmTitle">${escapeHtml(options.title || '發現重複芳名')}</h2>
          <p>${escapeHtml(options.message || '請確認是否仍要送出。')}</p>
          <ul class="duplicateList">${duplicateHtml}</ul>
          <div class="duplicateConfirmActions">
            <button class="duplicateCancel" type="button">取消</button>
            <button class="duplicateSubmit" type="button">${escapeHtml(options.confirmText || '仍要送出')}</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const finish = (value) => {
        overlay.remove();
        resolve(value);
      };
      overlay.querySelector('.duplicateCancel').addEventListener('click', () => finish(false));
      overlay.querySelector('.duplicateSubmit').addEventListener('click', () => finish(true));
      overlay.querySelector('.duplicateCancel').focus();
    });
  }

  function normalizeDuplicateName(value) {
    return String(value || '').trim().replace(/\s+/g, '').toLowerCase();
  }

  function resetForm() {
    els.representativeName.value = '';
    if (els.representativePhone) els.representativePhone.value = '';
    if (els.memo) els.memo.value = '';
    if (els.bulkDonors) els.bulkDonors.value = '';
    if (els.bulkDonorResult) els.bulkDonorResult.textContent = '';
    els.donorList.innerHTML = '';
    updateTotal();
  }

  function renderMyRecords() {
    if (!state.lineUserId) {
      els.myRecords.innerHTML = '<div class="notice">正在取得 LINE 身分，完成後會顯示你的回報紀錄。</div>';
      return;
    }

    if (state.myRecordsLoading) {
      els.myRecords.innerHTML = `
        <div class="myStatusSection">
          <div class="notice">Loading report status...</div>
        </div>
        ${renderQuickReportPanel()}
      `;
      return;
    }

    const mine = state.registrations
      .filter((record) => !isCancelled(record.paymentStatus))
      .filter((record) => record.lineUserId === state.lineUserId)
      .filter((record) => isFrontReportCaseId(record.caseId))
      .filter((record) => isPaymentPending(record.paymentStatus) || isReported(record.paymentStatus))
      .slice(0, 20);
    syncReportSelection(mine);
    const isEditingBatchReport = state.paymentReportMode === 'editingBatchReport';
    const visibleRecords = isEditingBatchReport
      ? mine.filter((record) => record.recordId === state.reportEditingHostId)
      : mine;

    const statusHtml = visibleRecords.length ? visibleRecords.map((record) => {
      const reported = isReported(record.paymentStatus);
      const reportLabel = reported ? '更正回報' : '付款回報';
      const checked = state.reportSelectedRecords.has(record.recordId);
      const recordInfoHtml = isEditingBatchReport
        ? `
            <div class="recordInfoPanel">
              <strong>${escapeHtml(record.recordId)}</strong>
              <span>金額 ${money(record.totalAmount)} 元</span>
            </div>
          `
        : `
            <label class="recordInfoPanel">
              <input class="reportRecordCheckbox" type="checkbox" value="${escapeAttr(record.recordId)}" ${checked ? 'checked' : ''}>
              <strong>${escapeHtml(record.recordId)}</strong>
              <span>金額 ${money(record.totalAmount)} 元</span>
            </label>
          `;
      return `
        <article class="recordCard" data-report-host="${escapeAttr(record.recordId)}">
          <div class="recordActionRow">
            ${recordInfoHtml}
            <div class="recordStatusPanel">
              <div>付款狀態 ${statusPill(record.paymentStatus, 'payment')}</div>
              <div>收據狀態 ${statusPill(record.receiptStatus, 'receipt')}</div>
            </div>
            ${isEditingBatchReport ? '' : `<button class="reportButton ${reported ? 'reported' : ''}" type="button" onclick="reportPayment('${escapeAttr(record.recordId)}')">${reportLabel}</button>`}
          </div>
          ${isEditingBatchReport && record.recordId === state.reportEditingHostId ? renderInlineReportForm(record.recordId) : ''}
        </article>
      `;
    }).join('') : '<div class="notice">目前沒有待回報或待確認的紀錄。</div>';

    els.myRecords.innerHTML = `
      <div class="myStatusSection">
        ${statusHtml}
        ${isEditingBatchReport ? '' : renderBatchReportToolbar(mine)}
      </div>
      ${isEditingBatchReport ? '' : renderQuickReportPanel()}
    `;
    if (isEditingBatchReport && state.reportEditingHostId) {
      bindInlineReportForm(state.reportEditingHostId);
    }
  }

  function getReportableMyRecords() {
    return state.registrations
      .filter((record) => !isCancelled(record.paymentStatus))
      .filter((record) => record.lineUserId === state.lineUserId)
      .filter((record) => isFrontReportCaseId(record.caseId))
      .filter((record) => isPaymentPending(record.paymentStatus) || isReported(record.paymentStatus));
  }

  function syncReportSelection(records) {
    if (state.paymentReportMode === 'editingBatchReport') return;
    state.paymentReportMode = records.length ? 'selecting' : 'idle';
    const validIds = new Set(records.map((record) => record.recordId));
    Array.from(state.reportSelectedRecords).forEach((recordId) => {
      if (!validIds.has(recordId)) state.reportSelectedRecords.delete(recordId);
    });
  }

  function selectedReportRecords(records = getReportableMyRecords()) {
    return records.filter((record) => state.reportSelectedRecords.has(record.recordId));
  }

  function selectedReportTotal(records = getReportableMyRecords()) {
    return selectedReportRecords(records)
      .reduce((sum, record) => sum + Number(record.totalAmount || 0), 0);
  }

  function setReportEditingRecordIds(recordIds) {
    state.reportEditingRecordIds = Array.from(new Set((recordIds || []).filter(Boolean)));
  }

  function isEditingReportRecordSelected(recordId) {
    return state.reportEditingRecordIds.includes(recordId);
  }

  function enterBatchReportEditing(recordId, recordIds) {
    state.paymentReportMode = 'editingBatchReport';
    state.reportEditingHostId = recordId;
    setReportEditingRecordIds(recordIds && recordIds.length ? recordIds : [recordId]);
  }

  function cancelBatchReportEditing(recordId) {
    document.getElementById(`inlineReportForm-${cssId(recordId)}`)?.remove();
    state.paymentReportMode = 'selecting';
    state.reportEditingHostId = '';
    state.reportEditingRecordIds = [];
    renderMyRecords();
  }

  function resetPaymentReportMode() {
    state.paymentReportMode = 'idle';
    state.reportSelectedRecords.clear();
    state.reportEditingHostId = '';
    state.reportEditingRecordIds = [];
    state.reportSelectionTouched = false;
    document.querySelectorAll('.inlineReportForm').forEach((form) => form.remove());
  }

  function renderBatchReportToolbar(records) {
    if (state.paymentReportMode === 'editingBatchReport') return '';
    if (!records.length) return '';
    const selected = selectedReportRecords(records);
    const selectedCountText = selected.length
      ? `已選 ${selected.length} 筆｜本次付款總額：${money(selectedReportTotal(records))} 元`
      : `本次付款總額：0 元`;
    const buttonText = selected.length ? '填寫勾選回報' : '請先選擇付款紀錄';
    return `
      <div class="notice">
        ${selectedCountText}
        <button id="batchReportButton" class="reportButton" type="button" ${selected.length ? '' : 'disabled'}>${buttonText}</button>
      </div>
    `;
  }

  function openSelectedReportForm() {
    if (state.paymentReportMode === 'editingBatchReport') return;
    const selected = selectedReportRecords();
    if (!selected.length) return;
    enterBatchReportEditing(selected[0].recordId, selected.map((record) => record.recordId));
    renderMyRecords();
    setTimeout(() => document.getElementById(`inlineReportLast5-${cssId(selected[0].recordId)}`)?.focus(), 50);
  }

  function renderQuickReportPanel() {
    const cases = getFrontReportCases();
    const caseOptions = cases.map((item) => `
      <option value="${escapeAttr(item.caseId)}">${escapeHtml(item.caseId)} ${escapeHtml(item.title || '')}</option>
    `).join('');
    return `
      <section class="quickReportPanel">
        <button id="quickReportToggle" class="quickReportToggle" type="button">小幫手代填回報專區</button>
        <div id="quickReportForm" class="quickReportForm hidden">
          <label class="quickReportField">
            <span>選擇專案</span>
            <select id="quickReportCase">${caseOptions}</select>
          </label>
          <label class="quickReportField">
            <span>搜尋代表人或芳名</span>
            <input id="quickReportKeyword" autocomplete="name" placeholder="輸入代表人姓名或芳名">
          </label>
          <button id="quickReportSearchButton" class="quickReportSearchButton" type="button">搜尋</button>
          <div id="quickReportResult" class="quickReportResult"></div>
        </div>
      </section>
    `;
  }

  function getFrontReportCases() {
    const cases = state.reportCases.length ? state.reportCases : state.cases;
    return cases.filter((item) => !isCaseClosedForFront(item));
  }

  function isFrontReportCaseId(caseId) {
    return getFrontReportCases().some((item) => item.caseId === caseId);
  }

  function isCaseClosedForFront(item) {
    const status = String(item?.status || '').trim();
    return item?.archived === true || ['已結案', '結案', '關閉', '已關閉', '未開放'].includes(status);
  }

  function toggleQuickReport() {
    document.getElementById('quickReportForm')?.classList.toggle('hidden');
  }

  function searchQuickReportRecords() {
    const caseId = document.getElementById('quickReportCase')?.value || '';
    const keyword = document.getElementById('quickReportKeyword')?.value.trim() || '';
    const resultBox = document.getElementById('quickReportResult');
    if (!resultBox) return;
    if (!caseId || !keyword) {
      resultBox.innerHTML = '<div class="notice">請選擇專案，並輸入代表人姓名或芳名。</div>';
      return;
    }
    resultBox.innerHTML = '<div class="notice">正在搜尋名單...</div>';
    google.script.run
      .withSuccessHandler((records) => renderQuickReportResults(records || []))
      .withFailureHandler((error) => {
        resultBox.innerHTML = `<div class="notice">${escapeHtml(error.message || error)}</div>`;
      })
      .searchRegistrationsForReport(caseId, keyword);
  }

  function renderQuickReportResults(records) {
    const resultBox = document.getElementById('quickReportResult');
    if (!resultBox) return;
    state.quickReportRecords = records || [];
    if (!records.length) {
      resultBox.innerHTML = '<div class="notice">查無資料，請確認專案、代表人或芳名。</div>';
      return;
    }
    resultBox.innerHTML = records.map((record) => `
      <article class="quickResultCard" data-report-host="${escapeAttr(record.recordId)}">
        <div>
          <strong>${escapeHtml(record.representativeName || record.recordId)}</strong>
          <span>${escapeHtml(record.recordId)}｜代表人總額 ${money(record.totalAmount)} 元</span>
          <small>${record.donors.map((donor) => `${escapeHtml(donor.name)} ${money(donor.amount)} 元`).join('、')}</small>
        </div>
        <button class="reportButton" type="button" onclick="reportPayment('${escapeAttr(record.recordId)}')">我要回報</button>
      </article>
    `).join('');
  }

  function getReportBatchCandidates(recordId) {
    const records = [
      ...getReportableMyRecords(),
      ...state.quickReportRecords
    ];
    const byId = {};
    records.forEach((record) => {
      if (!record || !record.recordId) return;
      if (isCancelled(record.paymentStatus)) return;
      if (!(isPaymentPending(record.paymentStatus) || isReported(record.paymentStatus))) return;
      if (record.lineUserId && record.lineUserId !== state.lineUserId) return;
      if (!isFrontReportCaseId(record.caseId)) return;
      byId[record.recordId] = record;
    });
    return Object.values(byId).sort((a, b) => {
      if (a.recordId === recordId) return -1;
      if (b.recordId === recordId) return 1;
      return String(a.recordId).localeCompare(String(b.recordId));
    });
  }

  function renderInlineBatchSummary(records) {
    const selected = records.filter((record) => isEditingReportRecordSelected(record.recordId));
    const total = selected.reduce((sum, record) => sum + Number(record.totalAmount || 0), 0);
    const lines = selected.map((record) => `${escapeHtml(record.recordId)}　${money(record.totalAmount)} 元`).join('<br>');
    return `
      <strong>本次付款</strong><br>
      已選 ${selected.length} 筆<br>
      合計 ${money(total)} 元
      ${lines ? `<div>${lines}</div>` : '<div>請至少選擇一筆。</div>'}
    `;
  }

  function reportPayment(recordId) {
    if (state.paymentReportMode === 'editingBatchReport') {
      if (state.reportEditingHostId !== recordId) return;
    } else {
      state.reportSelectedRecords.clear();
      state.reportSelectedRecords.add(recordId);
      enterBatchReportEditing(recordId, [recordId]);
    }
    state.reportSelectionTouched = true;
    const existing = document.getElementById(`inlineReportForm-${cssId(recordId)}`);
    if (existing) return;
    document.querySelectorAll('.inlineReportForm').forEach((form) => form.remove());

    const host = document.querySelector(`[data-report-host="${escapeAttr(recordId)}"]`)
      || document.querySelector(`[data-record-id="${escapeAttr(recordId)}"]`);
    if (!host) return;
    if (host.hasAttribute('data-report-host')) {
      renderMyRecords();
      setTimeout(() => document.getElementById(`inlineReportLast5-${cssId(recordId)}`)?.focus(), 50);
      return;
    }
    host.insertAdjacentHTML('beforeend', renderInlineReportForm(recordId));
    bindInlineReportForm(recordId);
    setTimeout(() => document.getElementById(`inlineReportLast5-${cssId(recordId)}`)?.focus(), 50);
  }

  function renderInlineReportForm(recordId) {
    const id = cssId(recordId);
    const candidates = getReportBatchCandidates(recordId);
    return `
      <form id="inlineReportForm-${id}" class="inlineReportForm" data-inline-report-id="${escapeAttr(recordId)}">
        <h3>付款回報</h3>
        <div id="inlineBatchSummary-${id}" class="notice">${renderInlineBatchSummary(candidates)}</div>
        <div class="reportStep">
          <div class="reportStepTitle">本次付款紀錄</div>
          <div class="reportChoiceStack">
            ${candidates.map((record) => `
              <label class="reportChoiceButton ${isEditingReportRecordSelected(record.recordId) ? 'selected' : ''}">
                <input class="inlineBatchCheckbox" type="checkbox" value="${escapeAttr(record.recordId)}" ${isEditingReportRecordSelected(record.recordId) ? 'checked' : ''}>
                ${escapeHtml(record.recordId)}　${money(record.totalAmount)} 元
              </label>
            `).join('')}
          </div>
        </div>
        <p>請先輸入匯款帳號末 5 碼；現金請輸入 00000。</p>
        <label class="inlineReportField">
          <span>帳號末 5 碼</span>
          <input id="inlineReportLast5-${id}" inputmode="numeric" autocomplete="one-time-code" maxlength="5" placeholder="12345">
        </label>
        <div id="inlineReportLast5Error-${id}" class="inlineReportError">請輸入剛好 5 個數字。</div>
        <div id="inlineReportSubmitNotice-${id}" class="inlineReportSubmitNotice hidden">正在送出回報，請不要重複點擊。</div>
        <div id="inlineReceiptStep-${id}" class="reportStep hidden">
          <div class="reportStepTitle">收據</div>
          <div class="reportChoiceGrid">
            <button class="reportChoiceButton" type="button" data-receipt-required="true">需要收據</button>
            <button class="reportChoiceButton" type="button" data-receipt-required="false">不需要收據</button>
          </div>
        </div>
        <div id="inlineReceiptFrequencyStep-${id}" class="reportStep hidden">
          <div class="reportStepTitle">開立頻率</div>
          <div class="reportChoiceStack">
            <button class="reportChoiceButton" type="button" data-receipt-frequency="annual">年度開立</button>
            <button class="reportChoiceButton" type="button" data-receipt-frequency="perPayment">每次開立</button>
            <button class="reportChoiceButton" type="button" data-receipt-frequency="other">其他</button>
          </div>
        </div>
        <div id="inlineReceiptTargetStep-${id}" class="reportStep hidden">
          <div class="reportStepTitle">開立對象</div>
          <div class="reportChoiceStack">
            <button class="reportChoiceButton" type="button" data-receipt-target="representativeTotal">代表人總額</button>
            <button class="reportChoiceButton" type="button" data-receipt-target="eachDonor">每位捐款人單獨開立</button>
          </div>
        </div>
        <div id="inlineReceiptEmailStep-${id}" class="reportStep hidden">
          <label class="emailInlineField">
            <span>Email地址：</span>
            <input id="inlineReceiptEmail-${id}" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com">
          </label>
        </div>
        <div id="inlineReportMemoStep-${id}" class="reportStep hidden">
          <label class="reportMemoField">
            <span>備註</span>
            <textarea id="inlineReportMemo-${id}" rows="3" placeholder="其他補充；選其他時請說明收據開立方式"></textarea>
          </label>
        </div>
        <div class="inlineReportActions">
          <button class="paymentModalCancel" type="button" data-inline-cancel>取消</button>
          <button class="paymentModalConfirm" type="submit" disabled>送出回報</button>
        </div>
      </form>
    `;
  }

  function bindInlineReportForm(recordId) {
    const id = cssId(recordId);
    const form = document.getElementById(`inlineReportForm-${id}`);
    const input = document.getElementById(`inlineReportLast5-${id}`);
    const error = document.getElementById(`inlineReportLast5Error-${id}`);
    const receiptStep = document.getElementById(`inlineReceiptStep-${id}`);
    const receiptFrequencyStep = document.getElementById(`inlineReceiptFrequencyStep-${id}`);
    const receiptTargetStep = document.getElementById(`inlineReceiptTargetStep-${id}`);
    const receiptEmailStep = document.getElementById(`inlineReceiptEmailStep-${id}`);
    const reportMemoStep = document.getElementById(`inlineReportMemoStep-${id}`);
    const receiptEmailInput = document.getElementById(`inlineReceiptEmail-${id}`);
    const reportMemoInput = document.getElementById(`inlineReportMemo-${id}`);
    const submitButton = form.querySelector('[type="submit"]');
    const submitNotice = document.getElementById(`inlineReportSubmitNotice-${id}`);
    const batchSummary = document.getElementById(`inlineBatchSummary-${id}`);
    const batchCheckboxes = Array.from(form.querySelectorAll('.inlineBatchCheckbox'));
    const candidates = getReportBatchCandidates(recordId);
    let receiptRequired = null;
    let receiptFrequency = '';
    let receiptTarget = '';
    let submitting = false;

    const selectedRecordIds = () => batchCheckboxes
      .filter((checkbox) => checkbox.checked)
      .map((checkbox) => checkbox.value);

    const updateState = () => {
      if (submitting) {
        submitButton.disabled = true;
        return;
      }
      batchSummary.innerHTML = renderInlineBatchSummary(candidates);
      batchCheckboxes.forEach((checkbox) => {
        checkbox.closest('.reportChoiceButton')?.classList.toggle('selected', checkbox.checked);
      });
      const hasSelection = selectedRecordIds().length > 0;
      const hasLast5 = /^\d{5}$/.test(input.value);
      receiptStep.classList.toggle('hidden', !hasLast5);
      if (!hasLast5) {
        receiptRequired = null;
        receiptFrequency = '';
        receiptTarget = '';
        receiptFrequencyStep.classList.add('hidden');
        receiptTargetStep.classList.add('hidden');
        receiptEmailStep.classList.add('hidden');
        reportMemoStep.classList.add('hidden');
        form.querySelectorAll('[data-receipt-required]').forEach((item) => item.classList.remove('selected'));
        form.querySelectorAll('[data-receipt-frequency], [data-receipt-target]').forEach((item) => item.classList.remove('selected'));
      }
      const receiptChosen = receiptRequired !== null;
      const needsReceipt = hasLast5 && receiptRequired === true;
      const frequencyChosen = receiptFrequency === 'annual' || receiptFrequency === 'perPayment';
      const otherReceipt = receiptFrequency === 'other';
      const targetChosen = Boolean(receiptTarget);
      receiptFrequencyStep.classList.toggle('hidden', !needsReceipt);
      receiptTargetStep.classList.toggle('hidden', !(needsReceipt && frequencyChosen));
      receiptEmailStep.classList.toggle('hidden', !needsReceipt);
      reportMemoStep.classList.toggle('hidden', !(hasLast5 && (receiptRequired === false || needsReceipt)));
      const emailOk = receiptRequired !== true || receiptEmailInput.value.trim();
      const receiptDetailOk = receiptRequired === false || otherReceipt || (frequencyChosen && targetChosen);
      const otherMemoOk = !otherReceipt || reportMemoInput.value.trim();
      submitButton.disabled = !(hasSelection && hasLast5 && receiptChosen && receiptDetailOk && otherMemoOk && emailOk);
    };

    batchCheckboxes.forEach((checkbox) => {
      checkbox.addEventListener('change', () => {
        setReportEditingRecordIds(selectedRecordIds());
        updateState();
      });
    });

    input.addEventListener('input', () => {
      const digits = input.value.replace(/\D/g, '').slice(0, 5);
      if (input.value !== digits) input.value = digits;
      error.classList.toggle('visible', digits.length > 0 && digits.length < 5);
      updateState();
    });

    form.querySelectorAll('[data-receipt-required]').forEach((button) => {
      button.addEventListener('click', () => {
        receiptRequired = button.dataset.receiptRequired === 'true';
        receiptFrequency = '';
        receiptTarget = '';
        form.querySelectorAll('[data-receipt-required]').forEach((item) => {
          item.classList.toggle('selected', item === button);
        });
        form.querySelectorAll('[data-receipt-frequency], [data-receipt-target]').forEach((item) => item.classList.remove('selected'));
        updateState();
      });
    });

    form.querySelectorAll('[data-receipt-frequency]').forEach((button) => {
      button.addEventListener('click', () => {
        receiptFrequency = button.dataset.receiptFrequency;
        receiptTarget = '';
        form.querySelectorAll('[data-receipt-frequency]').forEach((item) => {
          item.classList.toggle('selected', item === button);
        });
        form.querySelectorAll('[data-receipt-target]').forEach((item) => item.classList.remove('selected'));
        updateState();
      });
    });

    form.querySelectorAll('[data-receipt-target]').forEach((button) => {
      button.addEventListener('click', () => {
        receiptTarget = button.dataset.receiptTarget;
        form.querySelectorAll('[data-receipt-target]').forEach((item) => {
          item.classList.toggle('selected', item === button);
        });
        updateState();
      });
    });

    receiptEmailInput.addEventListener('input', updateState);
    reportMemoInput.addEventListener('input', updateState);
    form.querySelector('[data-inline-cancel]').addEventListener('click', () => cancelBatchReportEditing(recordId));
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (submitButton.disabled || submitting) return;
      submitting = true;
      submitButton.disabled = true;
      submitButton.textContent = '送出中';
      submitNotice.classList.remove('hidden');
      form.classList.add('submitting');
      form.querySelectorAll('input, textarea, button').forEach((control) => {
        control.disabled = true;
      });
      setBusy(true);
      google.script.run
        .withSuccessHandler((response) => {
          setBusy(false);
          resetPaymentReportMode();
          showReportSuccessDialog(response);
          loadData();
        })
        .withFailureHandler((error) => {
          submitting = false;
          form.classList.remove('submitting');
          submitNotice.classList.add('hidden');
          submitButton.textContent = '送出回報';
          form.querySelectorAll('input, textarea, button').forEach((control) => {
            control.disabled = false;
          });
          updateState();
          showError(error);
        })
        .reportRegistrationBatch({
          recordIds: selectedRecordIds(),
          paymentLast5: input.value,
          receiptRequired,
          receiptMode: buildReceiptModeValue(receiptFrequency, receiptTarget),
          receiptEmail: receiptEmailInput.value.trim(),
          memo: reportMemoInput.value.trim(),
          lineUserId: state.lineUserId,
          liffProfileName: state.liffProfileName
        });
    });
  }

  function renderAdminRows() {
    renderAdminCaseSummary();
    renderAdminWorkArea();
    renderAdminBulkBar();
  }

  function renderAdminCaseSummary() {
    document.querySelectorAll('[data-case-scope]').forEach((button) => {
      button.classList.toggle('active', button.dataset.caseScope === state.adminCaseScope);
    });
    if (els.adminCaseSearch) els.adminCaseSearch.value = state.adminCaseSearch;

    let caseIds = Array.from(new Set([
      ...state.cases.map((item) => item.caseId),
      ...state.reportCases.map((item) => item.caseId),
      ...state.registrations.map((record) => record.caseId)
    ])).filter(Boolean);

    caseIds = caseIds.filter((caseId) => {
      const caseInfo = state.reportCases.find((item) => item.caseId === caseId)
        || state.cases.find((item) => item.caseId === caseId)
        || {};
      const records = state.registrations.filter((record) => record.caseId === caseId);
      const archived = caseInfo.archived === true;
      if (state.adminCaseScope === 'history' && !archived) return false;
      if (state.adminCaseScope !== 'history' && archived) return false;
      if (state.adminCaseScope !== 'history' && !shouldShowAdminCase(caseInfo, records)) return false;
      return matchesAdminCaseSearch(caseInfo, records);
    });

    if (!caseIds.length) {
      const totalCases = state.reportCases.length || state.cases.length;
      const emptyMessage = totalCases
        ? (state.adminCaseScope === 'history' ? '目前沒有符合條件的歷史專案。' : '目前沒有符合條件的目前專案。')
        : '個案清單目前沒有資料，請先確認試算表的「個案清單」工作表。';
      els.adminCaseSummary.innerHTML = `<div class="notice">${emptyMessage}</div>`;
      return;
    }

    els.adminCaseSummary.innerHTML = caseIds.map((caseId) => {
      const caseInfo = state.reportCases.find((item) => item.caseId === caseId)
        || state.cases.find((item) => item.caseId === caseId)
        || {};
      const records = state.registrations.filter((record) => record.caseId === caseId);
      const active = state.adminCaseId === caseId;
      const pending = records.filter((record) => isPaymentPending(record.paymentStatus)).length;
      const reported = records.filter((record) => isReported(record.paymentStatus)).length;
      const receiptPending = records.filter((record) => isPaymentConfirmed(record.paymentStatus) && isReceiptPending(record.receiptStatus)).length;
      const done = records.filter((record) => isDone(record.paymentStatus) && !isReceiptPending(record.receiptStatus)).length;
      const needAction = records.filter(needsAdminAction).length;
      const statusLabel = caseStatusLabel(caseInfo);
      const statusKind = caseStatusKind(caseInfo);
      return `
        <button class="adminCaseCard ${active ? 'active' : ''} ${escapeAttr(statusKind)}" type="button" data-admin-case-id="${escapeAttr(caseId)}">
          <strong>${escapeHtml(caseId)} ${escapeHtml(caseInfo.title || '')}</strong>
          <em>${escapeHtml(statusLabel)}</em>
          <span>需處理 ${needAction} 筆｜總登記 ${records.length} 筆</span>
          <div class="adminCaseMoney">
            <span>目標金額 ${money(caseInfo.targetAmount)} 元</span>
            <span>目標餘額 ${money(caseInfo.remainingAmount)} 元</span>
          </div>
          <div class="adminCaseStats">
            <span>待付款 ${pending}</span>
            <span>已回報 ${reported}</span>
            <span>收據待處理 ${receiptPending}</span>
            <span>完成 ${done}</span>
          </div>
        </button>
      `;
    }).join('');
  }

  function matchesAdminCaseSearch(caseInfo, records) {
    const keyword = state.adminCaseSearch.toLowerCase();
    if (!keyword) return true;
    const donorText = records.map((record) => [
      record.representativeName,
      record.donors.map((donor) => donor.name).join(' ')
    ].join(' ')).join(' ');
    return [
      caseInfo.caseId,
      caseInfo.title,
      caseInfo.note,
      donorText
    ].some((value) => String(value || '').toLowerCase().includes(keyword));
  }

  function caseStatusLabel(caseInfo) {
    const kind = caseStatusKind(caseInfo);
    if (kind === 'history') return '歷史專案';
    if (kind === 'full') return '已額滿';
    if (kind === 'closed') return caseInfo.status || '未開放';
    return '開放中';
  }

  function caseStatusKind(caseInfo) {
    if (caseInfo.archived) return 'history';
    if (String(caseInfo.status || '').trim() === '已額滿' || isCaseFullForUi(caseInfo)) return 'full';
    if (!isCaseOpen(caseInfo)) {
      return Number(caseInfo.remainingAmount || 0) <= 0 ? 'full' : 'closed';
    }
    return 'open';
  }

  function shouldShowAdminCase(caseInfo, records) {
    const hasWork = records.some((record) => (
      isPaymentPending(record.paymentStatus)
      || isReported(record.paymentStatus)
      || isNeedInfo(record.paymentStatus)
      || (isPaymentConfirmed(record.paymentStatus) && isReceiptPending(record.receiptStatus))
    ));
    return !caseInfo.archived || hasWork;
  }

  function isCaseOpen(caseInfo) {
    const opened = String(caseInfo.opened ?? '').trim().toLowerCase();
    const status = String(caseInfo.status || '').trim();
    if (['已結案', '結案', '關閉', '已關閉', '已額滿', '未開放'].includes(status)) return false;
    return caseInfo.opened === true
      || opened === 'true'
      || opened === '是'
      || opened === '開放'
      || opened === '開放中';
  }

  function renderAdminWorkArea() {
    const hasCase = Boolean(state.adminCaseId);
    els.adminWorkArea.classList.toggle('hidden', !hasCase);
    if (!hasCase) {
      els.adminRows.innerHTML = '';
      return;
    }

    const caseInfo = state.reportCases.find((item) => item.caseId === state.adminCaseId)
      || state.cases.find((item) => item.caseId === state.adminCaseId)
      || {};
    if (caseInfo.archived && state.adminMode === 'helper') {
      state.adminMode = '';
    }
    const records = getVisibleAdminRecords();
    els.adminCaseTitle.textContent = `${state.adminCaseId} ${caseInfo.title || ''}`;
    els.adminCaseMeta.textContent = state.adminMode
      ? `目前模式：${state.adminMode === 'helper' ? '小幫手代填' : '資料處理'}`
      : '請選擇要執行的工作';
    els.adminSearch.value = state.adminSearch;
    document.querySelectorAll('.adminFilterButton').forEach((button) => {
      button.classList.toggle('active', button.dataset.filter === state.adminFilter);
    });
    const dataMode = state.adminMode === 'data';
    document.querySelector('.adminFilters')?.classList.toggle('hidden', !dataMode);
    els.adminSearch.classList.toggle('hidden', !dataMode);
    document.querySelector('.adminSelectLine')?.classList.toggle('hidden', !dataMode);

    if (!state.adminMode) {
      els.adminRows.innerHTML = renderAdminModeChooser();
      return;
    }

    if (state.adminMode === 'helper') {
      els.adminRows.innerHTML = renderHelperBatchPanel();
      return;
    }

    els.adminCaseMeta.textContent = `資料處理：目前顯示 ${records.length} 筆，已選 ${state.adminSelectedRecords.size} 筆`;

    if (!records.length) {
      els.adminRows.innerHTML = '<div class="notice">目前篩選條件下沒有資料。</div>';
      return;
    }

    els.adminRows.innerHTML = records.map((record) => {
      const selected = state.adminSelectedRecords.has(record.recordId);
      const cancelled = isCancelled(record.paymentStatus);
      return `
        <article class="adminRecordCard ${selected ? 'selected' : ''} ${cancelled ? 'cancelledRow' : ''}" data-record-id="${escapeAttr(record.recordId)}">
          <div class="adminCheck">${selected ? '✓' : ''}</div>
          <div class="adminRecordMain">
            <strong>${escapeHtml(record.recordId)}｜${money(record.totalAmount)} 元</strong>
            <span>${escapeHtml(record.representativeName)}　${sourceTypeLabel(record.sourceType)}</span>
            <small>${record.donors.map((donor) => `${escapeHtml(donor.name)} ${money(donor.amount)}`).join('、')}</small>
          </div>
          <div class="adminRecordStatus">
            <div>付款 ${statusPill(record.paymentStatus, 'payment')}</div>
            <div>收據 ${statusPill(record.receiptStatus, 'receipt')}</div>
          </div>
        </article>
      `;
    }).join('');
  }

  function renderAdminModeChooser() {
    return `
      <section class="adminModeChooser">
        ${state.adminCaseScope === 'history' ? '' : `
          <button class="adminModeButton helper" type="button" data-admin-mode="helper">
            <strong>小幫手代填</strong>
            <span>批次建立芳名與金額，讓捐款者之後到回報區搜尋。</span>
          </button>
        `}
        <button class="adminModeButton data" type="button" data-admin-mode="data">
          <strong>資料處理</strong>
          <span>對帳、收據、待補件、取消與批次修正。</span>
        </button>
        <button class="adminModeButton archive" type="button" data-case-archive-action="${state.adminCaseScope === 'history' ? 'restore' : 'archive'}">
          <strong>${state.adminCaseScope === 'history' ? '恢復為目前專案' : '專案結案'}</strong>
          <span>${state.adminCaseScope === 'history' ? '恢復後仍為未開放，請確認狀態後再開放登記。' : '結案後會從目前專案收起，前台不再顯示。'}</span>
        </button>
      </section>
    `;
  }

  function renderHelperBatchPanel() {
    const caseInfo = state.reportCases.find((item) => item.caseId === state.adminCaseId)
      || state.cases.find((item) => item.caseId === state.adminCaseId)
      || {};
    const remaining = Number(caseInfo.remainingAmount || 0);
    const canCreate = isCaseOpen(caseInfo) && remaining > 0;
    return `
      <section class="adminHelperPanel ${canCreate ? '' : 'locked'}">
        <div>
          <strong>小幫手批次代填</strong>
          <span>目前專案：${escapeHtml(state.adminCaseId)}。系統會建立一筆代表人總額回報，芳名保留為明細。</span>
          <span class="helperBalance">目標金額：${money(caseInfo.targetAmount)} 元</span>
          <span class="helperBalance">目前可登記餘額：${money(remaining)} 元</span>
        </div>
        <label class="adminHelperField">
          <span>代表人姓名</span>
          <input id="adminHelperRepresentativeName" placeholder="例如：張大同" ${canCreate ? '' : 'disabled'}>
        </label>
        <textarea id="adminHelperBatchInput" rows="4" placeholder="王小明100、李小華200" ${canCreate ? '' : 'disabled'}></textarea>
        <button id="adminHelperCreateButton" class="secondaryAction" type="button" ${canCreate ? '' : 'disabled'}>${canCreate ? '建立代填資料' : '專案已額滿或未開放'}</button>
        <div id="adminHelperBatchResult" class="helperBatchResult">${canCreate ? '' : '<div class="notice">此專案目前不能新增代填資料，但仍可進行資料處理。</div>'}</div>
      </section>
    `;
  }

  function createHelperBatchFromAdmin() {
    if (!state.adminCaseId) return;
    if (!state.lineUserId) {
      document.getElementById('adminHelperBatchResult').innerHTML = '<div class="notice">尚未取得小幫手 LINE 身分，請從 LINE 重新開啟。</div>';
      return;
    }
    const input = document.getElementById('adminHelperBatchInput');
    const representativeInput = document.getElementById('adminHelperRepresentativeName');
    const result = document.getElementById('adminHelperBatchResult');
    const representativeName = representativeInput?.value.trim() || '';
    const text = input?.value.trim() || '';
    if (!representativeName) {
      result.innerHTML = '<div class="notice">請先輸入代表人姓名，捐款者會用代表人找到這筆總額回報。</div>';
      return;
    }
    const donors = text
      .split(/[、，,；;\n\r]+/)
      .map((item) => item.trim())
      .filter(Boolean)
      .map(parseDonorToken)
      .filter(Boolean);
    if (!donors.length) {
      result.innerHTML = '<div class="notice">請用「姓名100、姓名200」格式輸入。</div>';
      return;
    }
    result.innerHTML = '<div class="notice">正在建立代填資料...</div>';
    const totalAmount = donors.reduce((sum, donor) => sum + donor.amount, 0);
    result.innerHTML = `
      <div class="notice">目前查詢餘額中，準備建立 1 筆代表人總額回報，含 ${donors.length} 位芳名，合計 ${money(totalAmount)} 元。請不要重複點擊。</div>
    `;
    const button = document.getElementById('adminHelperCreateButton');
    const panel = button?.closest('.adminHelperPanel');
    panel?.classList.add('submitting');
    if (button) {
      button.disabled = true;
      button.textContent = '建立中';
    }
    if (input) input.disabled = true;
    if (representativeInput) representativeInput.disabled = true;
    setBusy(true);
    google.script.run
      .withSuccessHandler((response) => {
        const remaining = Number(response.remainingAmount || 0);
        result.innerHTML = `
          <div class="success">
            建立成功：代表人 ${escapeHtml(representativeName)}，共 ${donors.length} 位芳名，總額 ${money(response.totalAmount)} 元。<br>
            最新可登記餘額：${money(remaining)} 元。
          </div>
        `;
        input.value = '';
        if (representativeInput) representativeInput.value = '';
        setTimeout(loadData, 1300);
      })
      .withFailureHandler((error) => {
        panel?.classList.remove('submitting');
        if (button) {
          button.disabled = false;
          button.textContent = '建立代填資料';
        }
        if (input) input.disabled = false;
        if (representativeInput) representativeInput.disabled = false;
        result.innerHTML = `<div class="notice">${escapeHtml(error.message || error)}</div>`;
        setBusy(false);
      })
      .createHelperRegistrations({
        caseId: state.adminCaseId,
        representativeName,
        donors,
        paymentMethod: 'bankTransfer',
        lineUserId: state.lineUserId,
        liffProfileName: state.liffProfileName,
        adminToken: getAdminToken()
      });
  }

  function setCurrentCaseArchiveState(archive) {
    if (!state.adminCaseId) return;
    const actionText = archive ? '專案結案' : '恢復為目前專案';
    if (!confirm(`確定要將 ${state.adminCaseId} ${actionText}？`)) return;
    setBusy(true);
    google.script.run
      .withSuccessHandler(() => {
        state.adminCaseScope = archive ? 'history' : 'current';
        state.adminCaseId = '';
        state.adminMode = '';
        state.adminSelectedRecords.clear();
        loadData();
      })
      .withFailureHandler(showError)
      .setCaseArchived(state.adminCaseId, archive, getAdminToken());
  }

  function getVisibleAdminRecords() {
    const keyword = state.adminSearch.toLowerCase();
    return state.registrations
      .filter((record) => record.caseId === state.adminCaseId)
      .filter((record) => {
        if (state.adminFilter === 'all') return true;
        if (state.adminFilter === 'needsAction') return needsAdminAction(record);
        if (state.adminFilter === 'reported') return isReported(record.paymentStatus);
        if (state.adminFilter === 'receiptPending') return isPaymentConfirmed(record.paymentStatus) && isReceiptPending(record.receiptStatus);
        if (state.adminFilter === 'pending') return isPaymentPending(record.paymentStatus);
        return true;
      })
      .filter((record) => {
        if (!keyword) return true;
        const donorText = record.donors.map((donor) => `${donor.name} ${donor.amount}`).join(' ');
        return [
          record.recordId,
          record.representativeName,
          record.representativePhone,
          record.totalAmount,
          donorText
        ].some((value) => String(value || '').toLowerCase().includes(keyword));
      });
  }

  function needsAdminAction(record) {
    return isReported(record.paymentStatus)
      || isNeedInfo(record.paymentStatus)
      || (isPaymentConfirmed(record.paymentStatus) && isReceiptPending(record.receiptStatus));
  }

  function sourceTypeLabel(value) {
    return {
      self_created: '前台本人登錄',
      helper_created: '小幫手代填',
      admin_created: '後台建立',
      前台本人登錄: '前台本人登錄',
      小幫手代填: '小幫手代填',
      後台建立: '後台建立'
    }[value] || '前台本人登錄';
  }

  function isReceiptPending(value) {
    return value === 'pending' || value === '待處理' || value === '';
  }

  function isNeedInfo(value) {
    return value === 'needInfo' || value === '待補件' || value === '資料待補';
  }

  function selectVisibleAdminRecords() {
    getVisibleAdminRecords()
      .filter((record) => !isCancelled(record.paymentStatus))
      .forEach((record) => state.adminSelectedRecords.add(record.recordId));
    renderAdminRows();
  }

  function renderAdminBulkBar() {
    const selected = Array.from(state.adminSelectedRecords);
    els.adminBulkBar.classList.toggle('hidden', !selected.length || state.currentView !== 'admin' || state.adminMode !== 'data');
    els.adminBulkCount.textContent = `已選 ${selected.length} 筆`;
  }

  async function runBulkAdminAction(action) {
    const recordIds = Array.from(state.adminSelectedRecords);
    if (!recordIds.length) return;

    const actionLabels = {
      paid: '確認入帳',
      receiptDone: '收據完成',
      paymentPending: '退回待付款',
      paymentReported: '退回已回報',
      paymentNeedInfo: '待補件',
      receiptPending: '收據待處理',
      receiptNotRequired: '不需收據',
      cancel: '取消登記'
    };
    const label = actionLabels[action] || '批次操作';
    const needsMemo = ['paymentPending', 'paymentReported', 'paymentNeedInfo', 'receiptPending', 'receiptNotRequired', 'cancel'].includes(action);
    const memo = needsMemo
      ? (prompt(`${label}：請輸入原因（將套用 ${recordIds.length} 筆，可空白）`) || '')
      : '';

    if (!confirm(`確定要將 ${recordIds.length} 筆資料「${label}」？`)) return;

    setBusy(true);
    try {
      for (const recordId of recordIds) {
        await runAdminAction(recordId, action, memo);
      }
      state.adminSelectedRecords.clear();
      loadData();
    } catch (error) {
      showError(error);
    }
  }

  function runAdminAction(recordId, action, memo) {
    const todayValue = today();
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);

      if (action === 'paid') {
        runner.updatePayment(recordId, 'paid', todayValue, getAdminToken());
      } else if (action === 'receiptDone') {
        runner.updateReceipt(recordId, 'done', '', todayValue, getAdminToken());
      } else if (action === 'paymentPending') {
        runner.resetPaymentStatus(recordId, 'pending', memo, getAdminToken());
      } else if (action === 'paymentReported') {
        runner.resetPaymentStatus(recordId, 'reported', memo, getAdminToken());
      } else if (action === 'paymentNeedInfo') {
        runner.resetPaymentStatus(recordId, 'needInfo', memo, getAdminToken());
      } else if (action === 'receiptPending') {
        runner.resetReceiptStatus(recordId, 'pending', memo, getAdminToken());
      } else if (action === 'receiptNotRequired') {
        runner.resetReceiptStatus(recordId, 'notRequired', memo, getAdminToken());
      } else if (action === 'cancel') {
        runner.cancelRegistration(recordId, memo, getAdminToken());
      } else {
        reject(new Error('未知的批次操作'));
      }
    });
  }

  function markPaid(recordId) {
    setBusy(true);
    google.script.run
      .withSuccessHandler(loadData)
      .withFailureHandler(showError)
      .updatePayment(recordId, 'paid', today(), getAdminToken());
  }

  function markReceiptDone(recordId) {
    const receiptNo = prompt('請輸入收據編號');
    if (!receiptNo) return;
    setBusy(true);
    google.script.run
      .withSuccessHandler(loadData)
      .withFailureHandler(showError)
      .updateReceipt(recordId, 'done', receiptNo, today(), getAdminToken());
  }

  function cancelRegistration(recordId) {
    const cancelMemo = prompt('請輸入取消原因（可空白）') || '';
    if (!confirm(`確定要取消 ${recordId}？取消後不會列入目前登記金額。`)) return;
    setBusy(true);
    google.script.run
      .withSuccessHandler(loadData)
      .withFailureHandler(showError)
      .cancelRegistration(recordId, cancelMemo, getAdminToken());
  }

  function resetPayment(recordId, status) {
    const labels = {
      pending: '退回待付款',
      reported: '退回已回報',
      paid: '確認入帳',
      cancelled: '取消登記'
    };
    const memo = prompt(`${labels[status] || '修正付款狀態'}：請輸入修正原因（可空白）`) || '';
    if (!confirm(`確定要將 ${recordId} ${labels[status] || '修正付款狀態'}？`)) return;
    setBusy(true);
    google.script.run
      .withSuccessHandler(loadData)
      .withFailureHandler(showError)
      .resetPaymentStatus(recordId, status, memo, getAdminToken());
  }

  function resetReceipt(recordId, status) {
    const labels = {
      pending: '收據退回待處理',
      notRequired: '改為不需收據',
      done: '收據已處理',
      ignored: '收據不處理'
    };
    const memo = prompt(`${labels[status] || '修正收據狀態'}：請輸入修正原因（可空白）`) || '';
    if (!confirm(`確定要將 ${recordId} ${labels[status] || '修正收據狀態'}？`)) return;
    setBusy(true);
    google.script.run
      .withSuccessHandler(loadData)
      .withFailureHandler(showError)
      .resetReceiptStatus(recordId, status, memo, getAdminToken());
  }

  function switchView(view) {
    const previousView = state.currentView;
    state.currentView = view;
    if (view === 'report' && previousView !== 'report') {
      resetPaymentReportMode();
    }
    document.getElementById('registrationView').classList.toggle('hidden', view !== 'registration');
    document.getElementById('reportView').classList.toggle('hidden', view !== 'report');
    document.getElementById('adminView').classList.toggle('hidden', view !== 'admin');
    els.bottomNav.classList.toggle('hidden', view === 'admin');
    renderAdminBulkBar();
    document.querySelectorAll('.tabButton').forEach((button) => {
      button.classList.toggle('active', button.dataset.view === view);
    });
    window.scrollTo(0, 0);
  }

  function openAdminWithPassword() {
    if (getAdminToken()) {
      switchView('admin');
      loadData();
      return;
    }

    const password = prompt('請輸入後台密碼');
    if (password === null) return;

    setBusy(true);
    google.script.run
      .withSuccessHandler((response) => {
        const token = response && response.token;
        if (!token) {
          clearAdminSession();
          alert('後台驗證失敗，請再試一次。');
          setBusy(false);
          return;
        }
        state.adminToken = token;
        sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
        sessionStorage.setItem(ADMIN_TOKEN_KEY, token);
        switchView('admin');
        loadData();
      })
      .withFailureHandler((error) => {
        clearAdminSession();
        setBusy(false);
        alert(error.message || error || '密碼錯誤');
      })
      .verifyAdminPassword(password, state.lineUserId);
  }

  function getAdminToken() {
    if (state.adminToken) return state.adminToken;
    const token = sessionStorage.getItem(ADMIN_TOKEN_KEY) || '';
    if (token) state.adminToken = token;
    return token;
  }

  function clearAdminSession() {
    state.adminToken = '';
    sessionStorage.removeItem(ADMIN_SESSION_KEY);
    sessionStorage.removeItem(ADMIN_TOKEN_KEY);
  }

  function statusPill(value, type) {
    const text = String(value || '').trim();
    const labels = {
      pending: type === 'payment' ? '待付款' : '待處理',
      paid: '已確認入帳',
      reported: '已回報',
      done: '收據已處理',
      notRequired: '不需收據',
      cancelled: '已取消',
      canceled: '已取消',
      needInfo: '待補件',
      待付款: '待付款',
      已回報: '已回報',
      已確認入帳: '已確認入帳',
      待補件: '待補件',
      資料待補: '待補件',
      待處理: '待處理',
      收據已處理: '收據已處理',
      不需收據: '不需收據',
      不處理: '不處理',
      已取消: '已取消'
    };

    let pillClass = 'pending';
    if (isCancelled(text)) {
      pillClass = 'cancelled';
    } else if (isNeedInfo(text)) {
      pillClass = 'paymentPending';
    } else if (isReported(text)) {
      pillClass = 'reported';
    } else if (isDone(text)) {
      pillClass = 'done';
    } else if (isPaymentPending(text) || text === '待處理' || !text) {
      pillClass = type === 'payment' ? 'paymentPending' : 'receiptPending';
    }

    return `<span class="pill ${pillClass}">${labels[text] || escapeHtml(text || '待處理')}</span>`;
  }

  function isPaymentPending(value) {
    return value === 'pending' || value === '待付款' || value === '';
  }

  function isReported(value) {
    return value === 'reported' || value === '已回報';
  }

  function isPaymentConfirmed(value) {
    return value === 'paid' || value === '已確認入帳' || value === '已入帳';
  }

  function isCancelled(value) {
    return value === 'cancelled' || value === 'canceled' || value === '已取消';
  }

  function isDone(value) {
    return ['paid', 'done', 'notRequired', '已確認入帳', '收據已處理', '不需收據', '不處理'].includes(value);
  }

  function setBusy(isBusy) {
    if (state.cases.length) {
      els.submitButton.disabled = isBusy;
    }
    els.refreshButton.disabled = isBusy;
    document.querySelectorAll('#adminView button, #adminBulkBar button').forEach((button) => {
      button.disabled = isBusy;
    });
  }

  function showError(error) {
    setBusy(false);
    const rawMessage = error.message || error;
    const message = escapeHtml(rawMessage);
    if (/Admin authorization required|Admin session expired/i.test(String(rawMessage || ''))) {
      clearAdminSession();
    }
    if (state.currentView === 'registration') {
      els.frontResult.innerHTML = `<div class="notice">${message}</div>`;
    } else if (state.currentView === 'report') {
      els.myRecords.innerHTML = `<div class="notice">${message}</div>`;
    } else {
      els.adminCaseSummary.innerHTML = `<div class="notice">後台資料讀取失敗：${message}</div>`;
    }
  }

  function showReportSuccessDialog(response) {
    document.querySelectorAll('.reportSuccessOverlay').forEach((item) => item.remove());
    const overlay = document.createElement('div');
    overlay.className = 'reportSuccessOverlay';
    const records = response?.records || [];
    const recordLines = records.map((record) => `${escapeHtml(record.recordId)}　${money(record.totalAmount)} 元`).join('<br>');
    const count = Number(response?.recordCount || records.length || 1);
    const total = Number(response?.paymentBatchTotal || records.reduce((sum, record) => sum + Number(record.totalAmount || 0), 0));
    overlay.innerHTML = `
      <div class="reportSuccessDialog" role="dialog" aria-modal="true" aria-labelledby="reportSuccessTitle">
        <h2 id="reportSuccessTitle">付款回報完成</h2>
        <p>本次共回報 ${count} 筆</p>
        <p>付款總額 ${money(total)} 元</p>
        ${recordLines ? `<p>${recordLines}</p>` : ''}
        <button class="reportSuccessConfirm" type="button">確認</button>
      </div>
    `;
    document.body.appendChild(overlay);
    const confirmButton = overlay.querySelector('.reportSuccessConfirm');
    confirmButton.focus();
    confirmButton.addEventListener('click', () => closeCurrentWindow(overlay));
  }

  function showRegistrationSuccessDialog(record) {
    if (!state.registrationNoticePending) return;
    state.registrationNoticePending = false;
    document.querySelectorAll('.reportSuccessOverlay').forEach((item) => item.remove());
    const overlay = document.createElement('div');
    overlay.className = 'reportSuccessOverlay';
    overlay.innerHTML = `
      <div class="reportSuccessDialog" role="dialog" aria-modal="true" aria-labelledby="registrationSuccessTitle">
        <h2 id="registrationSuccessTitle">登記完成</h2>
        <p>登記編號：${escapeHtml(record?.recordId || '')}</p>
        <p>請先完成匯款，完成後請在本頁填寫回報。</p>
        <button class="reportSuccessConfirm" type="button">確定</button>
      </div>
    `;
    document.body.appendChild(overlay);
    const confirmButton = overlay.querySelector('.reportSuccessConfirm');
    confirmButton.focus();
    confirmButton.addEventListener('click', () => overlay.remove());
  }

  function closeCurrentWindow(overlay) {
    overlay?.remove();
    try {
      if (window.liff && liff.closeWindow) {
        liff.closeWindow();
        setTimeout(() => {
          try {
            window.close();
          } catch (error) {
            // Some in-app browsers block scripted window closing.
          }
        }, 250);
      } else {
        window.close();
      }
    } catch (error) {
      try {
        window.close();
      } catch (closeError) {
        // If the browser blocks closing, the success dialog is already dismissed.
      }
    }
  }

  function money(value) {
    return Number(value || 0).toLocaleString('zh-TW');
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeAttr(value) {
    return escapeHtml(value).replaceAll('`', '&#096;');
  }

  function cssId(value) {
    return String(value || '').replace(/[^a-zA-Z0-9_-]/g, '_');
  }
</script>
